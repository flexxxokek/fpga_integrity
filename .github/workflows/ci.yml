name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint RTL
        run: make lint

      - name: Run cocotb regression
        run: make sim-quick

      - name: Test scientific false-rate generators
        run: make test-false-rate

      - name: Smoke false-rate model campaign
        run: python scripts/false_rate_suite.py --generator gilbert_elliott --packets 200 --length 32 --seed 42 --out data/ci_false_rate.csv

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cocotb-results
          path: |
            tb/results.xml
            sim_build/**/results.xml
          if-no-files-found: ignore
